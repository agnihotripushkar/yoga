# Production Configuration for PostgreSQL

# Database Configuration (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/yoga_app}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:yoga_user}
spring.datasource.password=${DATABASE_PASSWORD:yoga_password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Flyway Configuration for Production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Production Security Settings
server.servlet.session.cookie.secure=true
server.port=${PORT:8080}

# Production Logging
logging.level.com.devpush.yoga=INFO
logging.level.com.devpush.yoga.security=WARN
logging.level.com.devpush.yoga.service=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# Custom File Upload Settings for Production
app.file.upload.base-path=${FILE_UPLOAD_PATH:/app/uploads}
app.file.upload.max-size=5242880
app.file.upload.allowed-types=image/jpeg,image/png,image/webp
app.file.upload.allowed-extensions=jpg,jpeg,png,webp

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000