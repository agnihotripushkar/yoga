spring.application.name=yogaBE

# JWT Configuration
jwt.secret=${JWT_SECRET:yoga-app-secret-key-for-development-only-change-in-production}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# OAuth Configuration
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.apple.team-id=${APPLE_TEAM_ID:}
oauth.apple.key-id=${APPLE_KEY_ID:}
oauth.apple.client-id=${APPLE_CLIENT_ID:}
oauth.apple.private-key=${APPLE_PRIVATE_KEY:}

# Rate Limiting
rate-limit.auth.requests-per-minute=10
rate-limit.auth.requests-per-hour=100

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# Logging Configuration
logging.level.com.devpush.yoga=INFO
logging.level.com.devpush.yoga.security=DEBUG
logging.level.com.devpush.yoga.service=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n
