spring.application.name=yogaBE

# JWT Configuration
jwt.secret=${JWT_SECRET:yoga-app-secret-key-for-development-only-change-in-production}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# OAuth Configuration
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.apple.team-id=${APPLE_TEAM_ID:}
oauth.apple.key-id=${APPLE_KEY_ID:}
oauth.apple.client-id=${APPLE_CLIENT_ID:}
oauth.apple.private-key=${APPLE_PRIVATE_KEY:}

# Rate Limiting
rate-limit.auth.requests-per-minute=10
rate-limit.auth.requests-per-hour=100

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# Custom File Upload Settings
app.file.upload.base-path=uploads
app.file.upload.max-size=5242880
app.file.upload.allowed-types=image/jpeg,image/png,image/webp
app.file.upload.allowed-extensions=jpg,jpeg,png,webp

# Database Configuration (Development - H2)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Flyway Configuration
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# PostgreSQL Configuration (Production - Override with environment variables)
# spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/yoga_app}
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=${DATABASE_USERNAME:yoga_user}
# spring.datasource.password=${DATABASE_PASSWORD:yoga_password}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=false

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# Server Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# Disable unnecessary endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false

# Logging Configuration
logging.level.com.devpush.yoga=INFO
logging.level.com.devpush.yoga.security=DEBUG
logging.level.com.devpush.yoga.service=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n
