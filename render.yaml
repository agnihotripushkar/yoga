services:
  - type: web
    name: yoga-app
    env: java
    buildCommand: ./gradlew build -x test
    startCommand: java -Dserver.port=$PORT -Dspring.profiles.active=prod -jar build/libs/yogaBE-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yoga-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: yoga-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: yoga-db
          property: password

databases:
  - name: yoga-db
    databaseName: yoga_app
    user: yoga_user
    plan: free